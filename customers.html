<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management - POS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Custom styling to match SweetAlert with your dark theme */
        .swal2-popup {
            background: #1e293b !important;
            color: white !important;
            border: 1px solid #374151 !important;
        }
    </style>
</head>
<body class="bg-[#0f172a] text-white font-sans flex flex-col md:flex-row h-screen overflow-hidden relative">
    
    <div class="md:hidden bg-[#1f2937] p-4 flex justify-between items-center border-b border-gray-700 w-full flex-shrink-0 z-40 relative shadow-md">
        <div class="font-bold text-sm tracking-wide text-white flex items-center gap-2">
            <i class="fas fa-clinic-medical text-indigo-400"></i> POS System
        </div>
        <button id="mobile-menu-btn" class="text-gray-300 hover:text-white focus:outline-none p-1">
            <i class="fas fa-bars text-xl"></i>
        </button>
    </div>

    <aside id="sidebar" class="absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition duration-300 ease-in-out z-50 w-64 bg-[#1f2937] flex flex-col justify-between border-r border-gray-700 h-full flex-shrink-0 shadow-2xl md:shadow-none">
        <div>
            <div class="p-4 bg-gradient-to-r from-indigo-500 to-purple-600 text-center font-bold text-sm tracking-wide shadow-md flex items-center justify-between md:justify-center gap-2">
                <div class="flex items-center gap-2">
                    <i class="fas fa-clinic-medical text-lg"></i> Point of Sale
                </div>
                <button id="close-sidebar-btn" class="md:hidden text-white hover:text-gray-200 focus:outline-none">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <nav class="mt-6 flex flex-col gap-2 px-4 overflow-y-auto">
                <a href="index.html" class="text-gray-300 hover:bg-gray-700 py-2.5 px-4 rounded-lg flex items-center gap-3 text-sm font-medium transition-colors">
                    <i class="fas fa-home w-5"></i> Dashboard
                </a>
                <a href="pos.html" class="text-gray-300 hover:bg-gray-700 py-2.5 px-4 rounded-lg flex items-center gap-3 text-sm font-medium transition-colors">
                    <i class="fas fa-shopping-cart w-5"></i> POS
                </a>
                <a href="medicines.html" class="text-gray-300 hover:bg-gray-700 py-2.5 px-4 rounded-lg flex items-center gap-3 text-sm font-medium transition-colors">
                    <i class="fas fa-pills w-5"></i> Medicines
                </a>
                <a href="customers.html" class="bg-blue-600 text-white py-2.5 px-4 rounded-lg flex items-center gap-3 text-sm font-medium transition-colors">
                    <i class="fas fa-users w-5"></i> Customers
                </a>
                <a href="sales-history.html" class="text-gray-300 hover:bg-gray-700 py-2.5 px-4 rounded-lg flex items-center gap-3 text-sm font-medium transition-colors">
                    <i class="fas fa-file-invoice-dollar w-5"></i> Sales History
                </a>
                <a href="reports.html" class="text-gray-300 hover:bg-gray-700 py-2.5 px-4 rounded-lg flex items-center gap-3 text-sm font-medium transition-colors">
                    <i class="fas fa-chart-bar w-5"></i> Reports
                </a>
                <a href="purchase-order.html" class="text-gray-300 hover:bg-gray-700 py-2.5 px-4 rounded-lg flex items-center gap-3 text-sm font-medium transition-colors">
                    <i class="fas fa-clipboard-list w-5"></i> Purchase Order
                </a>
            </nav>
        </div>
        
        <div class="p-3 bg-[#374151] m-4 rounded-xl flex items-center gap-3 shadow-lg">
            <div class="w-10 h-10 bg-gray-600 rounded-lg flex items-center justify-center font-bold text-lg">A</div>
            <div>
                <div class="text-sm font-bold text-white">Muhammad Uzair</div>
                <div class="text-xs text-gray-400">Administrator</div>
            </div>
        </div>
    </aside>

    <main class="flex-1 p-4 md:p-8 overflow-y-auto w-full relative">
        <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden transition-opacity"></div>

        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 md:mb-8">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-white mb-1">Customer Management</h1>
                <p class="text-gray-400 text-sm">Manage your customer database</p>
            </div>
            <button onclick="openModal()" class="w-full sm:w-auto justify-center bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium transition-colors flex items-center gap-2 shadow-lg">
                <i class="fas fa-plus"></i> Add Customer
            </button>
        </div>

        <div class="mb-6 relative">
            <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="customer-search" onkeyup="filterCustomers()" placeholder="Search customers..." 
                   class="w-full max-w-md bg-[#1e293b] border border-gray-700 text-white rounded-lg py-2.5 pl-11 pr-4 focus:outline-none focus:border-blue-500 shadow-md">
        </div>

        <div class="bg-[#1e293b] border border-gray-700 rounded-xl overflow-x-auto shadow-lg w-full">
            <table class="w-full text-left border-collapse min-w-[600px]">
                <thead>
                    <tr class="bg-[#334155] border-b border-gray-700 text-gray-400 text-xs uppercase tracking-wider">
                        <th class="p-3 md:p-4 font-semibold">Customer</th>
                        <th class="p-3 md:p-4 font-semibold">Contact</th>
                        <th class="p-3 md:p-4 font-semibold">Gender</th>
                        <th class="p-3 md:p-4 font-semibold">Status</th>
                        <th class="p-3 md:p-4 font-semibold text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="customers-table-body" class="text-sm"></tbody>
            </table>
        </div>
    </main>

    <div id="customerModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-[#1e293b] rounded-xl shadow-2xl w-full max-w-lg overflow-hidden border border-gray-700 flex flex-col max-h-[90vh]">
            <div class="p-4 md:p-5 border-b border-gray-700 flex justify-between items-center bg-[#0f172a] flex-shrink-0">
                <h2 id="modalTitle" class="text-lg md:text-xl font-bold text-white">Add New Customer</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white p-1"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-4 md:p-6 overflow-y-auto flex-1">
                <form id="customerForm" onsubmit="saveCustomer(event)">
                    <input type="hidden" id="custId">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-300 mb-1">Full Name *</label>
                        <input type="text" id="custName" required class="w-full bg-[#334155] border border-gray-600 text-white rounded-lg py-2 px-3 focus:border-blue-500 outline-none">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Phone *</label>
                            <input type="text" id="custPhone" required class="w-full bg-[#334155] border border-gray-600 text-white rounded-lg py-2 px-3 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                            <input type="email" id="custEmail" class="w-full bg-[#334155] border border-gray-600 text-white rounded-lg py-2 px-3 outline-none">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-300 mb-1">Address</label>
                        <input type="text" id="custAddress" class="w-full bg-[#334155] border border-gray-600 text-white rounded-lg py-2 px-3 outline-none">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Gender</label>
                            <select id="custGender" class="w-full bg-[#334155] border border-gray-600 text-white rounded-lg py-2 px-3 outline-none">
                                <option value="Male">Male</option><option value="Female">Female</option><option value="Any">Any</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Status</label>
                            <select id="custStatus" class="w-full bg-[#334155] border border-gray-600 text-white rounded-lg py-2 px-3 outline-none">
                                <option value="Active">Active</option><option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 pt-4 border-t border-gray-700">
                        <button type="button" onclick="closeModal()" class="text-gray-300 py-2 px-4 bg-gray-700 sm:bg-transparent rounded-lg sm:rounded-none">Cancel</button>
                        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Save Customer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="historyModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-[#1e293b] rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden border border-gray-700 flex flex-col max-h-[90vh]">
            <div class="p-4 md:p-5 border-b border-gray-700 flex justify-between items-center bg-[#0f172a] flex-shrink-0">
                <h2 class="text-lg md:text-xl font-bold text-white"><i class="fas fa-history mr-2 text-green-400"></i> Customer History</h2>
                <button onclick="closeHistoryModal()" class="text-gray-400 hover:text-white p-1"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-4 md:p-6 overflow-y-auto flex-1">
                <div id="historyContent" class="text-gray-300"></div>
                <div class="flex justify-end pt-4 border-t border-gray-700 mt-6">
                    <button type="button" onclick="closeHistoryModal()" class="w-full sm:w-auto bg-gray-600 hover:bg-gray-500 px-6 py-2 rounded-lg font-bold text-white transition-colors">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Alert Helper for Toasts
        const showToast = (title, icon = 'success') => {
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true,
                background: '#1e293b',
                color: '#fff'
            });
            Toast.fire({ icon: icon, title: title });
        };

        // --- MOBILE SIDEBAR TOGGLE ---
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const closeSidebarBtn = document.getElementById('close-sidebar-btn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
        }

        mobileMenuBtn.addEventListener('click', toggleSidebar);
        closeSidebarBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        // --- DATABASE LOGIC ---
        let customersData = [];

        async function fetchCustomers() {
            try {
                const response = await fetch('customers_api.php');
                const result = await response.json();
                if (result.status === 'success') {
                    customersData = result.data;
                    renderCustomers(customersData);
                }
            } catch (error) {
                console.error("API Call fail:", error);
            }
        }

        function filterCustomers() {
            const query = document.getElementById('customer-search').value.toLowerCase();
            const filteredData = customersData.filter(cust => 
                (cust.name && cust.name.toLowerCase().includes(query)) || 
                (cust.phone && cust.phone.toLowerCase().includes(query)) ||
                (cust.email && cust.email.toLowerCase().includes(query))
            );
            renderCustomers(filteredData);
        }

        function renderCustomers(data) {
            const tbody = document.getElementById('customers-table-body');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">No customers found</td></tr>`;
                return;
            }

            data.forEach(cust => {
                let statusBadge = cust.status === 'Active' 
                    ? `<span class="bg-green-900/50 text-[#22c55e] py-1 px-2 rounded-full text-xs font-bold">${cust.status}</span>`
                    : `<span class="bg-red-900/50 text-red-400 py-1 px-2 rounded-full text-xs font-bold">${cust.status}</span>`;
                
                tbody.innerHTML += `
                    <tr class="border-b border-gray-700 hover:bg-[#334155] transition-colors">
                        <td class="p-3 md:p-4 whitespace-nowrap"><b>${cust.name}</b><br><small class="text-gray-500">${cust.email}</small></td>
                        <td class="p-3 md:p-4 whitespace-nowrap">${cust.phone}<br><small class="text-gray-500 truncate max-w-[150px] inline-block">${cust.address}</small></td>
                        <td class="p-3 md:p-4 text-gray-300">${cust.gender}</td>
                        <td class="p-3 md:p-4">${statusBadge}</td>
                        <td class="p-3 md:p-4 text-right whitespace-nowrap">
                            <button onclick="viewHistory(${cust.id})" title="View POS History" class="text-green-400 mr-3 hover:text-green-300 transition-colors"><i class="fas fa-history text-sm"></i></button>
                            <button onclick="editCustomer(${cust.id})" title="Edit" class="text-blue-400 mr-3 hover:text-blue-300 transition-colors"><i class="fas fa-edit text-sm"></i></button>
                            <button onclick="deleteCustomer(${cust.id})" title="Delete" class="text-red-400 hover:text-red-300 transition-colors"><i class="fas fa-trash-alt text-sm"></i></button>
                        </td>
                    </tr>`;
            });
        }

        // --- RESTRICTION LOGIC: Check if Phone already exists ---
        async function saveCustomer(event) {
            event.preventDefault();
            const id = document.getElementById('custId').value;
            const phone = document.getElementById('custPhone').value.trim();
            const name = document.getElementById('custName').value.trim();

            // Check for duplicate phone (ignore current customer if editing)
            const duplicate = customersData.find(c => c.phone === phone && c.id != id);

            if (duplicate) {
                Swal.fire({
                    title: 'Phone Number Already Exists!',
                    text: `This phone number is already registered to ${duplicate.name}.`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Change Number',
                    cancelButtonText: 'Cancel'
                }).then((result) => {
                    if (result.isConfirmed) {
                        document.getElementById('custPhone').focus();
                    } else {
                        closeModal();
                    }
                });
                return; // Stop execution
            }
            
            const payload = {
                action: 'save',
                id: id ? id : '',
                name: name,
                phone: phone,
                email: document.getElementById('custEmail').value || "N/A",
                address: document.getElementById('custAddress').value || "N/A",
                gender: document.getElementById('custGender').value,
                status: document.getElementById('custStatus').value
            };

            try {
                const response = await fetch('customers_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                if(result.status === 'success') {
                    closeModal();
                    fetchCustomers();
                    showToast(id ? 'Customer updated!' : 'Customer added!');
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            } catch (error) {
                console.error("Save Error:", error);
            }
        }

        async function deleteCustomer(id) {
            Swal.fire({
                title: 'Are you sure?',
                text: "Delete this customer permanently?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Yes, delete it!'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const response = await fetch('customers_api.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'delete', id: id })
                        });
                        const res = await response.json();
                        if(res.status === 'success') {
                            fetchCustomers();
                            showToast('Deleted successfully', 'success');
                        }
                    } catch (error) { console.error(error); }
                }
            });
        }

        function openModal() { 
            document.getElementById('customerForm').reset(); 
            document.getElementById('custId').value = ''; 
            document.getElementById('modalTitle').innerText = 'Add New Customer';
            document.getElementById('customerModal').classList.remove('hidden'); 
        }
        
        function closeModal() { 
            document.getElementById('customerModal').classList.add('hidden'); 
        }
        
        function editCustomer(id) {
            const c = customersData.find(cust => cust.id == id);
            if(c) {
                document.getElementById('custId').value = c.id;
                document.getElementById('custName').value = c.name || "";
                document.getElementById('custPhone').value = c.phone || "";
                document.getElementById('custEmail').value = c.email !== "N/A" ? c.email : "";
                document.getElementById('custAddress').value = c.address !== "N/A" ? c.address : "";
                document.getElementById('custGender').value = c.gender || "Any";
                document.getElementById('custStatus').value = c.status || "Active";
                document.getElementById('modalTitle').innerText = 'Edit Customer';
                document.getElementById('customerModal').classList.remove('hidden');
            }
        }

        async function viewHistory(id) {
            const c = customersData.find(cust => cust.id == id);
            document.getElementById('historyContent').innerHTML = '<div class="text-center py-4"><i class="fas fa-spinner fa-spin text-2xl text-blue-400"></i></div>';
            document.getElementById('historyModal').classList.remove('hidden');

            try {
                const response = await fetch('sales_api.php');
                const result = await response.json();
                let contentHtml = `<p class="mb-4 text-sm text-gray-400">Records for: <strong class="text-white">${c.name}</strong></p>`;

                if(result.status === 'success') {
                    const customerSales = result.data.filter(sale => sale.customer_name && sale.customer_name.toLowerCase() === c.name.toLowerCase());
                    if (customerSales.length === 0) {
                        contentHtml += `<div class="bg-[#334155] p-4 rounded-lg text-sm">No record found.</div>`;
                    } else {
                        contentHtml += `<div class="border border-gray-700 rounded-lg overflow-x-auto w-full"><table class="w-full text-left border-collapse text-sm min-w-[500px]"><thead class="bg-[#334155]"><tr class="text-gray-400"><th class="p-3">Invoice</th><th class="p-3">Date</th><th class="p-3 text-center">Status</th><th class="p-3 text-right">Amount</th></tr></thead><tbody>`;
                        let total = 0;
                        customerSales.forEach(sale => {
                            let amt = parseFloat(sale.total_amount) || 0;
                            if(sale.status === 'Completed') total += amt;
                            contentHtml += `<tr class="border-b border-gray-700 hover:bg-[#334155]"><td class="p-3 text-blue-400">INV-${sale.invoice_no}</td><td class="p-3">${sale.sale_date}</td><td class="p-3 text-center"><span class="px-2 py-0.5 rounded text-xs ${sale.status === 'Completed' ? 'bg-green-900/50 text-green-400' : 'bg-red-900/50 text-red-400'}">${sale.status}</span></td><td class="p-3 text-right font-bold text-green-400">PKR ${amt.toLocaleString()}</td></tr>`;
                        });
                        contentHtml += `</tbody><tfoot class="bg-[#0f172a]"><tr><td colspan="3" class="p-3 text-right text-gray-400">Total:</td><td class="p-3 text-right text-green-400 font-bold">PKR ${total.toLocaleString()}</td></tr></tfoot></table></div>`;
                    }
                }
                document.getElementById('historyContent').innerHTML = contentHtml;
            } catch(e) { document.getElementById('historyContent').innerHTML = "Error loading data."; }
        }

        function closeHistoryModal() { document.getElementById('historyModal').classList.add('hidden'); }

        fetchCustomers();
    </script>
</body>
</html>
