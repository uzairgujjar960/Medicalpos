<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Terminal - Professional Medical Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-modal { animation: scaleIn 0.2s ease-out forwards; }
        
        #products-list::-webkit-scrollbar { width: 4px; }
        #products-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* SweetAlert Dark Theme */
        .swal2-popup {
            background: #1e293b !important;
            color: white !important;
            border: 1px solid #374151 !important;
            border-radius: 1rem !important;
        }
        .swal2-title, .swal2-html-container { color: white !important; }

        @media print {
            @page { margin: 0; }
            body { background: white !important; color: black !important; margin: 0; padding: 0; }
            aside, main, .no-print, button, #mobile-header { display: none !important; }
            #printFrame { display: block !important; width: 100% !important; }
        }
    </style>
</head>

<body class="bg-[#0f172a] text-white font-sans flex flex-col md:flex-row h-screen overflow-hidden relative">

    <div id="warning-overlay" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[400] backdrop-blur-sm">
        <div class="bg-[#1e293b] p-8 rounded-3xl border border-red-900/30 shadow-2xl text-center animate-modal max-w-sm w-full mx-4">
            <div class="w-20 h-20 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-5 border-2 border-red-500/20">
                <i class="fas fa-exclamation-triangle text-3xl"></i>
            </div>
            <h2 id="warning-title" class="text-xl font-bold text-white mb-2">Action Required</h2>
            <p id="warning-message" class="text-gray-400 text-sm mb-6"></p>
            <button onclick="closeWarningModal()" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-xl transition-all">Understood</button>
        </div>
    </div>

    <div id="viewCartModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-[60] p-4 backdrop-blur-sm">
        <div class="bg-[#1e293b] rounded-xl shadow-2xl w-full max-w-2xl border border-gray-700 overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center bg-[#0f172a]">
                <h3 class="text-lg font-bold text-blue-400"><i class="fas fa-list-ul mr-2"></i> Review Items</h3>
                <button onclick="closeCartModal()" class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            <div class="p-4 md:p-6 overflow-x-auto overflow-y-auto flex-1">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-gray-400 text-xs uppercase border-b border-gray-700">
                            <th class="pb-3">Medicine</th>
                            <th class="pb-3 text-center">Qty</th>
                            <th class="pb-3 text-right">Price</th>
                            <th class="pb-3 text-right">Total</th>
                            <th class="pb-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="modal-cart-items" class="text-sm"></tbody>
                </table>
            </div>
            <div class="p-4 bg-[#0f172a] border-t border-gray-700 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="text-lg font-bold text-[#22c55e]">Final Total: <span id="modal-total-display">PKR 0.00</span></div>
                <div class="flex gap-3">
                    <button onclick="closeCartModal()" class="bg-gray-700 px-4 py-2 rounded-lg font-bold">Back</button>
                    <button onclick="checkout()" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-bold flex items-center gap-2"><i class="fas fa-print"></i> Print</button>
                </div>
            </div>
        </div>
    </div>

    <iframe id="printFrame" style="display:none;"></iframe>

    <aside id="sidebar" class="absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition duration-300 ease-in-out z-50 w-64 bg-[#1f2937] flex flex-col justify-between border-r border-gray-700 h-full flex-shrink-0 shadow-2xl md:shadow-none">
        <div>
            <div class="p-4 bg-gradient-to-r from-indigo-500 to-purple-600 text-center font-bold text-sm tracking-wide shadow-md flex items-center justify-between md:justify-center gap-2">
                <div class="flex items-center gap-2"><i class="fas fa-clinic-medical text-lg"></i> Point of Sale</div>
                <button id="close-sidebar-btn" class="md:hidden text-white"><i class="fas fa-times"></i></button>
            </div>
            <nav class="mt-6 flex flex-col gap-2 px-4 overflow-y-auto">
                <a href="index.html" class="text-gray-300 hover:bg-gray-700 py-2.5 px-4 rounded-lg flex items-center gap-3 text-sm font-medium transition-colors"><i class="fas fa-home w-5"></i> Dashboard</a>
                <a href="pos.html" class="bg-blue-600 text-white py-2.5 px-4 rounded-lg flex items-center gap-3 text-sm font-medium transition-colors shadow-lg"><i class="fas fa-shopping-cart w-5"></i> POS</a>
                <a href="medicines.html" class="text-gray-300 hover:bg-gray-700 py-2.5 px-4 rounded-lg flex items-center gap-3 text-sm font-medium transition-colors"><i class="fas fa-pills w-5"></i> Medicines</a>
                <a href="customers.html" class="text-gray-300 hover:bg-gray-700 py-2.5 px-4 rounded-lg flex items-center gap-3 text-sm font-medium transition-colors"><i class="fas fa-users w-5"></i> Customers</a>
                <a href="sales-history.html" class="text-gray-300 hover:bg-gray-700 py-2.5 px-4 rounded-lg flex items-center gap-3 text-sm font-medium transition-colors"><i class="fas fa-file-invoice-dollar w-5"></i> Sales History</a>
                <a href="reports.html" class="text-gray-300 hover:bg-gray-700 py-2.5 px-4 rounded-lg flex items-center gap-3 text-sm font-medium transition-colors"><i class="fas fa-chart-bar w-5"></i> Reports</a>
                <a href="purchase-order.html" class="text-gray-300 hover:bg-gray-700 py-2.5 px-4 rounded-lg flex items-center gap-3 text-sm font-medium transition-colors"><i class="fas fa-clipboard-list w-5"></i> Purchase Order</a>
            </nav>
        </div>
        <div class="p-3 bg-[#374151] m-4 rounded-xl flex items-center gap-3 shadow-lg">
            <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-lg text-white">U</div>
            <div class="text-sm">
                <div class="font-bold">Muhammad Uzair</div>
                <div class="text-xs text-gray-400 italic">Administrator</div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden w-full relative">
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden"></div>

        <div class="flex-1 p-4 md:p-6 flex flex-col lg:h-full overflow-hidden">
            <div class="mb-4 relative">
                <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="Search medicines..." class="w-full bg-[#1e293b] border border-gray-700 text-white rounded-lg py-3 pl-12 pr-4 focus:outline-none focus:border-blue-500 shadow-md">
            </div>
            <div id="products-list" class="overflow-y-auto flex-1 pr-2 flex flex-col gap-1.5 pb-4">
                <div class="text-center text-gray-500 py-10"><i class="fas fa-spinner fa-spin text-2xl"></i></div>
            </div>
        </div>

        <div class="w-full lg:w-80 bg-[#1e293b] border-t lg:border-t-0 lg:border-l border-gray-700 flex flex-col lg:h-full flex-shrink-0">
            <div class="p-4 border-b border-gray-700">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2"><i class="fas fa-shopping-cart text-blue-400"></i> Cart</h2>
                    <button onclick="openCartModal()" class="text-[10px] bg-[#334155] hover:bg-blue-600 px-2 py-1 rounded text-blue-300 hover:text-white font-bold">List View</button>
                </div>
                <div class="relative">
                    <label class="text-[10px] text-gray-400 uppercase font-bold tracking-wider block mb-1">Customer</label>
                    <input type="text" id="pos-customer-input" placeholder="Leave empty for Walk-in" onkeyup="searchSavedCustomers()" class="w-full bg-[#334155] border border-gray-600 text-white rounded-lg py-2 px-3 text-sm focus:border-blue-500 transition-all">
                    <div id="customer-search-results" class="absolute left-0 right-0 mt-1 bg-[#1f2937] border border-gray-700 rounded-lg shadow-2xl hidden z-50 max-h-40 overflow-y-auto"></div>
                </div>
            </div>

            <div id="cart-items-container" class="flex-1 flex flex-col p-4 overflow-y-auto gap-2">
                <div class="text-center text-gray-600 mt-10 italic opacity-50">Empty Cart</div>
            </div>

            <div class="px-4 py-2 border-t border-gray-700">
                <label class="text-[10px] text-gray-400 uppercase font-bold mb-2 block">Payment Method</label>
                <div class="grid grid-cols-2 gap-2">
                    <button id="method-cash" onclick="setPaymentMethod('Cash')" class="bg-blue-600 text-white text-[11px] font-bold py-2 rounded-lg flex items-center justify-center gap-2 border border-blue-400 transition-all">
                        <i class="fas fa-money-bill-wave"></i> Cash
                    </button>
                    <button id="method-card" onclick="setPaymentMethod('Card')" class="bg-[#334155] text-gray-400 text-[11px] font-bold py-2 rounded-lg flex items-center justify-center gap-2 border border-gray-600 transition-all hover:bg-gray-700">
                        <i class="fas fa-credit-card"></i> Card
                    </button>
                </div>
            </div>

            <div class="p-4 bg-[#1e293b]">
                <div class="flex gap-3 mb-4">
                    <div class="flex-1">
                        <label class="text-[10px] text-gray-400 uppercase font-bold mb-1 block">Disc (%)</label>
                        <input type="number" id="discount-input" value="0" min="0" max="100" oninput="calculateTotals()" class="w-full bg-[#334155] border border-gray-600 text-white rounded-lg py-1.5 px-3 text-xs outline-none">
                    </div>
                    <div class="flex-1">
                        <label class="text-[10px] text-gray-400 uppercase font-bold mb-1 block">Tax (%)</label>
                        <input type="number" id="tax-input" value="0" min="0" max="100" oninput="calculateTotals()" class="w-full bg-[#334155] border border-gray-600 text-white rounded-lg py-1.5 px-3 text-xs outline-none">
                    </div>
                </div>

                <div class="space-y-1 mb-4">
                    <div class="flex justify-between text-gray-400 text-xs"><span>Subtotal:</span><span id="subtotal-display">PKR 0.00</span></div>
                    <div class="flex justify-between text-[#22c55e] font-black text-lg border-t border-gray-700 pt-1"><span>Total:</span><span id="total-display">PKR 0.00</span></div>
                </div>
                <button onclick="checkout()" id="checkout-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 rounded-xl shadow-lg active:scale-95 flex justify-center items-center gap-2 uppercase">
                    <i class="fas fa-print"></i> COMPLETE SALE
                </button>
            </div>
        </div>
    </main>

    <script>
        let dbProducts = []; 
        let dbCustomers = [];
        let cart = [];
        let selectedMethod = "Cash"; // Default Selection

        // --- PAYMENT METHOD TOGGLE ---
        function setPaymentMethod(method) {
            selectedMethod = method;
            const cashBtn = document.getElementById('method-cash');
            const cardBtn = document.getElementById('method-card');

            if (method === 'Cash') {
                cashBtn.className = "bg-blue-600 text-white text-[11px] font-bold py-2 rounded-lg flex items-center justify-center gap-2 border border-blue-400 transition-all";
                cardBtn.className = "bg-[#334155] text-gray-400 text-[11px] font-bold py-2 rounded-lg flex items-center justify-center gap-2 border border-gray-600 transition-all hover:bg-gray-700";
            } else {
                cardBtn.className = "bg-blue-600 text-white text-[11px] font-bold py-2 rounded-lg flex items-center justify-center gap-2 border border-blue-400 transition-all";
                cashBtn.className = "bg-[#334155] text-gray-400 text-[11px] font-bold py-2 rounded-lg flex items-center justify-center gap-2 border border-gray-600 transition-all hover:bg-gray-700";
            }
        }

        function openWarningModal(t, m) { document.getElementById('warning-title').innerText = t; document.getElementById('warning-message').innerText = m; document.getElementById('warning-overlay').style.display = 'flex'; }
        function closeWarningModal() { document.getElementById('warning-overlay').style.display = 'none'; }

        async function loadDatabaseData() {
            try {
                const [mRes, cRes] = await Promise.all([
                    fetch('medicines_api.php').then(r => r.json()),
                    fetch('customers_api.php').then(r => r.json())
                ]);
                if(mRes.status === 'success') dbProducts = mRes.data;
                if(cRes.status === 'success') dbCustomers = cRes.data;
                renderProducts(dbProducts);
            } catch (e) { console.error("Database Error"); }
        }

        function renderProducts(items) {
            const container = document.getElementById('products-list');
            container.innerHTML = items.length === 0 ? `<p class="text-center text-gray-500 py-10">No items found.</p>` : '';
            items.forEach(p => {
                let s = parseInt(p.stock) || 0;
                container.innerHTML += `
                <div onclick="addToCart(${p.id})" class="bg-[#1e293b] border border-gray-700 py-2.5 px-4 rounded-lg flex justify-between items-center cursor-pointer hover:bg-[#334155] transition-all group shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-[#334155] rounded-full flex items-center justify-center text-blue-400 group-hover:bg-blue-600 group-hover:text-white transition-colors"><i class="fas fa-pills"></i></div>
                        <div><h3 class="font-bold text-white text-xs">${p.name}</h3><div class="text-[10px] ${s<=5?'text-red-400 font-bold':'text-gray-500'}">Stock: ${s}</div></div>
                    </div>
                    <div class="text-[#22c55e] font-bold text-sm">PKR ${parseFloat(p.price).toFixed(2)}</div>
                </div>`;
            });
        }

        function filterProducts() {
            const q = document.getElementById('search-input').value.toLowerCase();
            renderProducts(dbProducts.filter(p => p.name.toLowerCase().includes(q)));
        }

        function addToCart(id) {
            const p = dbProducts.find(i => i.id == id);
            if (!p || p.stock <= 0) return openWarningModal("Stock Alert!", "This item is currently out of stock.");
            const exist = cart.find(i => i.id == id);
            if (exist) {
                if (exist.qty >= p.stock) return openWarningModal("Stock Limit", "No more units available in stock.");
                exist.qty++;
            } else { cart.push({ ...p, qty: 1 }); }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            container.innerHTML = cart.length === 0 ? '<div class="text-center text-gray-600 mt-10 italic opacity-50">Empty Cart</div>' : '';
            cart.forEach(item => {
                container.innerHTML += `
                <div class="bg-[#334155] p-3 rounded-lg relative">
                    <div class="flex justify-between items-start mb-2"><h4 class="text-[11px] font-bold text-white pr-5 leading-tight">${item.name}</h4><button onclick="removeFromCart(${item.id})" class="text-red-400 absolute top-2 right-2"><i class="fas fa-times text-xs"></i></button></div>
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-1 bg-[#1e293b] rounded px-1 py-0.5 border border-gray-600">
                            <button onclick="changeQty(${item.id}, -1)" class="text-red-400 px-1 font-bold">-</button>
                            <input type="number" value="${item.qty}" min="1" onfocus="this.value=''" onchange="manualQtyUpdate(${item.id}, this.value)" class="text-xs text-white font-bold w-7 text-center bg-transparent border-none focus:outline-none m-0 p-0">
                            <button onclick="changeQty(${item.id}, 1)" class="text-green-400 px-1 font-bold">+</button>
                        </div>
                        <div class="text-[#22c55e] text-[11px] font-bold">PKR ${(item.price * item.qty).toFixed(2)}</div>
                    </div>
                </div>`;
            });
            calculateTotals();
        }

        function manualQtyUpdate(id, val) {
            const item = cart.find(i => i.id == id);
            const p = dbProducts.find(i => i.id == id);
            let newQty = parseInt(val);
            if (isNaN(newQty) || newQty <= 0) { removeFromCart(id); return; }
            if (newQty > p.stock) {
                openWarningModal("Stock Limit", `Only ${p.stock} units available.`);
                item.qty = parseInt(p.stock);
            } else { item.qty = newQty; }
            updateCartUI();
            if(document.getElementById('viewCartModal').style.display !== 'none') updateModalUI();
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id == id);
            const p = dbProducts.find(i => i.id == id);
            if (item) {
                if (delta > 0 && item.qty >= p.stock) return openWarningModal("Stock Alert", "Maximum stock reached.");
                item.qty += delta;
                if (item.qty <= 0) removeFromCart(id); else { updateCartUI(); updateModalUI(); }
            }
        }

        function removeFromCart(id) { cart = cart.filter(i => i.id != id); updateCartUI(); if (cart.length > 0) updateModalUI(); else closeCartModal(); }

        function calculateTotals() {
            let sub = 0; cart.forEach(i => sub += (i.price * i.qty));
            const discP = parseFloat(document.getElementById('discount-input').value) || 0;
            const taxP = parseFloat(document.getElementById('tax-input').value) || 0;
            const discAmt = (sub * discP / 100);
            const total = (sub - discAmt) + ((sub - discAmt) * taxP / 100);
            document.getElementById('subtotal-display').innerText = `PKR ${sub.toFixed(2)}`;
            document.getElementById('total-display').innerText = `PKR ${Math.max(0, total).toFixed(2)}`;
        }

        function searchSavedCustomers() {
            const q = document.getElementById('pos-customer-input').value.toLowerCase().trim();
            const box = document.getElementById('customer-search-results');
            if (!q) { box.classList.add('hidden'); return; }
            const filtered = dbCustomers.filter(c => c.name.toLowerCase().includes(q));
            box.innerHTML = '';
            if (filtered.length > 0) {
                box.classList.remove('hidden');
                filtered.forEach(c => { box.innerHTML += `<button onclick="selectCustomer('${c.name}')" class="w-full text-left p-3 text-sm hover:bg-blue-600 border-b border-gray-700 last:border-0 transition-colors">${c.name}</button>`; });
            } else { box.classList.add('hidden'); }
        }

        function selectCustomer(n) { document.getElementById('pos-customer-input').value = n; document.getElementById('customer-search-results').classList.add('hidden'); }

        // --- UPDATED RECEIPT WITH PAYMENT METHOD ---
        function printThermalReceipt(inv, cust, items, sub, disc, tax, tot) {
            const date = new Date().toLocaleString('en-US', { hour12: true, year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' });
            const doc = document.getElementById('printFrame').contentWindow.document;
            doc.open();
            let h = `<div style="font-family:monospace; font-size:12px; width:260px; margin:0 auto; color:#000; text-align:center; padding:10px;">
                <h3 style="margin:0;">PAKISTAN MEDICAL STORE</h3>
                <p style="margin:2px 0;">Lahore | 0301-9646054</p>
                <div style="border-top:1px dashed #000; margin:5px 0;"></div>
                <div style="text-align:left;">
                    <strong>Inv:</strong> ${inv}<br>
                    <strong>Date:</strong> ${date}<br>
                    <strong>Method:</strong> ${selectedMethod}<br>
                    <strong>Cust:</strong> <span style="font-weight:bold;">${cust}</span>
                </div>
                <div style="border-top:1px dashed #000; margin:5px 0;"></div>
                <table style="width:100%; font-size:11px; border-collapse:collapse;">
                    ${items.map(i => `<tr><td style="text-align:left; padding:2px 0;">${i.name}</td><td style="text-align:center;">${i.qty}</td><td style="text-align:right;">${(i.price*i.qty).toFixed(2)}</td></tr>`).join('')}
                </table>
                <div style="border-top:1px dashed #000; margin:5px 0;"></div>
                <div style="text-align:right; font-size:11px;">
                    Subtotal: ${sub.toFixed(2)}<br>
                    Discount: -${disc.toFixed(2)}<br>
                    Tax: +${tax.toFixed(2)}<br>
                    <strong style="font-size:13px;">TOTAL: PKR ${tot.toFixed(2)}</strong>
                </div>
                <p style="margin-top:10px;">*** Get Well Soon ***</p>
            </div>`;
            doc.write(h); doc.close();
            setTimeout(() => { document.getElementById('printFrame').contentWindow.print(); }, 500);
        }

        async function checkout() {
            const custName = document.getElementById('pos-customer-input').value.trim() || "Walk-in Customer";
            if (cart.length === 0) return openWarningModal("Cart is Empty", "Pehle koi medicine select karein.");

            const sub = parseFloat(document.getElementById('subtotal-display').innerText.replace('PKR ', ''));
            const tot = parseFloat(document.getElementById('total-display').innerText.replace('PKR ', ''));
            const discP = parseFloat(document.getElementById('discount-input').value) || 0;
            const taxP = parseFloat(document.getElementById('tax-input').value) || 0;
            const discAmt = (sub * discP / 100);
            const taxAmt = ((sub - discAmt) * taxP / 100);

            const invID = "INV-" + Date.now();
            const btn = document.getElementById('checkout-btn');
            btn.disabled = true; btn.innerText = "Processing...";

            const payload = {
                action: 'save_sale', invoice_no: invID, customer: custName, total: tot, 
                discount: discAmt, tax: taxAmt, payment_method: selectedMethod,
                date: new Date().toISOString().slice(0, 19).replace('T', ' '),
                items: cart.map(i => ({ id: i.id, qty: i.qty, price: i.price }))
            };

            try {
                const res = await fetch('sales_api.php', { method: 'POST', body: JSON.stringify(payload) }).then(r => r.json());
                if (res.status === 'success') {
                    printThermalReceipt(invID, custName, cart, sub, discAmt, taxAmt, tot);
                    
                    // Professional SweetAlert Replacement
                    Swal.fire({
                        icon: 'success',
                        title: 'Sale Successful!',
                        text: `Invoice ${invID} saved via ${selectedMethod}.`,
                        confirmButtonText: 'Next Sale',
                        confirmButtonColor: '#2563eb'
                    });

                    cart = []; 
                    document.getElementById('discount-input').value = 0;
                    document.getElementById('tax-input').value = 0;
                    document.getElementById('pos-customer-input').value = "";
                    setPaymentMethod('Cash'); // Reset
                    updateCartUI(); loadDatabaseData(); closeCartModal();
                } else { Swal.fire('Error', res.message, 'error'); }
            } catch (e) { Swal.fire('Connection Error', 'Could not connect to API.', 'error'); }
            finally { btn.disabled = false; btn.innerText = "COMPLETE SALE"; }
        }

        function openCartModal() { if (cart.length > 0) { document.getElementById('viewCartModal').classList.remove('hidden'); updateModalUI(); } }
        function closeCartModal() { document.getElementById('viewCartModal').classList.add('hidden'); }
        function updateModalUI() {
            const b = document.getElementById('modal-cart-items');
            b.innerHTML = '';
            cart.forEach(i => { 
                b.innerHTML += `<tr class="border-b border-gray-800"><td class="py-3 text-white">${i.name}</td><td class="text-center"><input type="number" value="${i.qty}" onfocus="this.value=''" onchange="manualQtyUpdate(${i.id}, this.value)" class="w-12 text-center bg-[#0f172a] text-white border border-gray-700 rounded px-1"></td><td class="text-right">${parseFloat(i.price).toFixed(2)}</td><td class="text-right text-[#22c55e] font-bold">${(i.price*i.qty).toFixed(2)}</td><td class="text-center"><button onclick="removeFromCart(${i.id})" class="text-red-400"><i class="fas fa-trash"></i></button></td></tr>`; 
            });
            document.getElementById('modal-total-display').innerText = document.getElementById('total-display').innerText;
        }

        loadDatabaseData();
    </script>
</body>
</html>
